# =============================================================================
# Hasura table metadata.
#
# There is exactly ONE Hasura role for application traffic: `user`.
# Org roles (owner / editor / viewer) are NOT Hasura roles, because they are
# per-organization — the same person can be an owner in Org A and a viewer in
# Org B. Putting them in the JWT would make the role ambiguous, so every rule
# below resolves the caller's role by joining to org_members with
# X-Hasura-User-Id. That is Layer 1: no row is reachable unless the caller has
# a membership row in that row's org.
#
# Layer 2 lives in the `_or` blocks on workflow_steps / workflow_triggers,
# where the required role depends on the step or trigger *type*, and in the
# Action handlers for the mid-execution decisions permissions cannot express.
# =============================================================================

# ---------------------------------------------------------------- organizations
- table:
    schema: public
    name: organizations
  array_relationships:
    - name: members
      using:
        foreign_key_constraint_on:
          table: { schema: public, name: org_members }
          column: org_id
    - name: workflows
      using:
        foreign_key_constraint_on:
          table: { schema: public, name: workflows }
          column: org_id
    - name: runs
      using:
        foreign_key_constraint_on:
          table: { schema: public, name: workflow_runs }
          column: org_id
  object_relationships:
    - name: usage
      using:
        manual_configuration:
          remote_table: { schema: public, name: org_usage_current_month }
          column_mapping: { id: org_id }
  select_permissions:
    - role: user
      permission:
        columns: [id, name, quota_limit, quota_used, quota_period_start, created_at]
        filter:
          members:
            user_id: { _eq: X-Hasura-User-Id }
  update_permissions:
    - role: user
      permission:
        columns: [name]
        filter: &owner_of_org
          members:
            _and:
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _eq: owner }
        check: *owner_of_org
  # quota_limit is deliberately not updatable by any client role — only admin.

# ------------------------------------------------------------------ org_members
- table:
    schema: public
    name: org_members
  object_relationships:
    - name: organization
      using:
        foreign_key_constraint_on: org_id
  select_permissions:
    # any member of the org can see who else is in it
    - role: user
      permission:
        columns: [id, org_id, user_id, role, email, created_at]
        filter:
          organization:
            members:
              user_id: { _eq: X-Hasura-User-Id }
  insert_permissions:
    # membership management is owner-only
    - role: user
      permission:
        columns: [org_id, user_id, role, email]
        check: &owner_of_related_org
          organization:
            members:
              _and:
                - user_id: { _eq: X-Hasura-User-Id }
                - role: { _eq: owner }
  update_permissions:
    - role: user
      permission:
        columns: [role, email]
        filter: *owner_of_related_org
        check: *owner_of_related_org
  delete_permissions:
    - role: user
      permission:
        filter: *owner_of_related_org

# -------------------------------------------------------------------- workflows
- table:
    schema: public
    name: workflows
  object_relationships:
    - name: organization
      using:
        foreign_key_constraint_on: org_id
  array_relationships:
    - name: steps
      using:
        foreign_key_constraint_on:
          table: { schema: public, name: workflow_steps }
          column: workflow_id
    - name: triggers
      using:
        foreign_key_constraint_on:
          table: { schema: public, name: workflow_triggers }
          column: workflow_id
    - name: runs
      using:
        foreign_key_constraint_on:
          table: { schema: public, name: workflow_runs }
          column: workflow_id
  select_permissions:
    # viewer included: read-only access to the org's workflows
    - role: user
      permission:
        columns: [id, org_id, name, description, is_active, created_by, created_at, updated_at]
        filter: &member_of_workflow_org
          organization:
            members:
              user_id: { _eq: X-Hasura-User-Id }
        allow_aggregations: true
  insert_permissions:
    - role: user
      permission:
        columns: [org_id, name, description, is_active]
        set:
          created_by: X-Hasura-User-Id
        check: &editor_of_workflow_org
          organization:
            members:
              _and:
                - user_id: { _eq: X-Hasura-User-Id }
                - role: { _in: [owner, editor] }
  update_permissions:
    - role: user
      permission:
        columns: [name, description, is_active]
        filter: *editor_of_workflow_org
        check: *editor_of_workflow_org
  delete_permissions:
    - role: user
      permission:
        filter:
          organization:
            members:
              _and:
                - user_id: { _eq: X-Hasura-User-Id }
                - role: { _eq: owner }

# --------------------------------------------------------------- workflow_steps
- table:
    schema: public
    name: workflow_steps
  object_relationships:
    - name: workflow
      using:
        foreign_key_constraint_on: workflow_id
  select_permissions:
    - role: user
      permission:
        columns: [id, workflow_id, position, type, name, config, created_at, updated_at]
        filter: &member_of_step_org
          workflow:
            organization:
              members:
                user_id: { _eq: X-Hasura-User-Id }
  insert_permissions:
    # LAYER 2 — the required role depends on the step type.
    # db_write and notify reach outside the sandbox: owner only.
    # Everything else: owner or editor.
    - role: user
      permission:
        columns: [workflow_id, position, type, name, config]
        check: &step_type_gate
          _or:
            - _and:
                - type: { _nin: [db_write, notify] }
                - workflow:
                    organization:
                      members:
                        _and:
                          - user_id: { _eq: X-Hasura-User-Id }
                          - role: { _in: [owner, editor] }
            - _and:
                - type: { _in: [db_write, notify] }
                - workflow:
                    organization:
                      members:
                        _and:
                          - user_id: { _eq: X-Hasura-User-Id }
                          - role: { _eq: owner }
  update_permissions:
    - role: user
      permission:
        columns: [position, type, name, config]
        filter: *step_type_gate
        check: *step_type_gate
  delete_permissions:
    - role: user
      permission:
        filter: *step_type_gate

# ------------------------------------------------------------ workflow_triggers
- table:
    schema: public
    name: workflow_triggers
  object_relationships:
    - name: workflow
      using:
        foreign_key_constraint_on: workflow_id
  select_permissions:
    # webhook_secret is NOT selectable by any client role. Owners read it
    # through the getWebhookUrl Action, which re-checks their role.
    - role: user
      permission:
        columns: [id, workflow_id, type, config, next_run_at, is_active, created_at]
        filter:
          workflow:
            organization:
              members:
                user_id: { _eq: X-Hasura-User-Id }
  insert_permissions:
    # LAYER 2 — a webhook trigger opens an unauthenticated inbound door,
    # so only an owner may create one.
    - role: user
      permission:
        columns: [workflow_id, type, config, is_active]
        check: &trigger_type_gate
          _or:
            - _and:
                - type: { _neq: webhook }
                - workflow:
                    organization:
                      members:
                        _and:
                          - user_id: { _eq: X-Hasura-User-Id }
                          - role: { _in: [owner, editor] }
            - _and:
                - type: { _eq: webhook }
                - workflow:
                    organization:
                      members:
                        _and:
                          - user_id: { _eq: X-Hasura-User-Id }
                          - role: { _eq: owner }
  update_permissions:
    - role: user
      permission:
        columns: [config, is_active]
        filter: *trigger_type_gate
        check: *trigger_type_gate
  delete_permissions:
    - role: user
      permission:
        filter: *trigger_type_gate

# ---------------------------------------------------------------- workflow_runs
- table:
    schema: public
    name: workflow_runs
  object_relationships:
    - name: workflow
      using:
        foreign_key_constraint_on: workflow_id
    - name: organization
      using:
        foreign_key_constraint_on: org_id
  array_relationships:
    - name: step_runs
      using:
        foreign_key_constraint_on:
          table: { schema: public, name: step_runs }
          column: workflow_run_id
  select_permissions:
    - role: user
      permission:
        columns: [id, workflow_id, org_id, status, trigger_type, triggered_by,
                  input, output, error, started_at, finished_at, created_at, updated_at]
        filter:
          organization:
            members:
              user_id: { _eq: X-Hasura-User-Id }
        allow_aggregations: true
  # No insert/update/delete for role `user`. Runs are created and advanced only
  # by the Action handlers, so a viewer cannot start one by writing the row
  # directly, and nobody can hand-edit a run's status mid-flight.
  event_triggers:
    - name: run_started
      definition:
        enable_manual: true
        insert:
          columns: '*'
      retry_conf:
        num_retries: 2
        interval_sec: 10
        timeout_sec: 120
      webhook_from_env: NHOST_FUNCTIONS_URL_RUN_EXECUTOR
      headers:
        - name: x-internal-secret
          value_from_env: INTERNAL_WEBHOOK_SECRET

# -------------------------------------------------------------------- step_runs
- table:
    schema: public
    name: step_runs
  object_relationships:
    - name: workflow_run
      using:
        foreign_key_constraint_on: workflow_run_id
    - name: step
      using:
        foreign_key_constraint_on: step_id
  select_permissions:
    # this is what the live subscription reads
    - role: user
      permission:
        columns: [id, workflow_run_id, step_id, position, type, name, status,
                  input, output, error, attempt_count, approved_by, approved_at,
                  started_at, finished_at, created_at, updated_at]
        filter:
          workflow_run:
            organization:
              members:
                user_id: { _eq: X-Hasura-User-Id }
  # Approvals are never a direct update: they go through the approveStep Action.

# ----------------------------------------------------------------- step_outputs
- table:
    schema: public
    name: step_outputs
  object_relationships:
    - name: organization
      using:
        foreign_key_constraint_on: org_id
  select_permissions:
    - role: user
      permission:
        columns: [id, org_id, workflow_run_id, step_run_id, key, value, created_at]
        filter:
          organization:
            members:
              user_id: { _eq: X-Hasura-User-Id }

# ---------------------------------------------------------------- notifications
- table:
    schema: public
    name: notifications
  object_relationships:
    - name: organization
      using:
        foreign_key_constraint_on: org_id
  select_permissions:
    - role: user
      permission:
        columns: [id, org_id, workflow_run_id, step_run_id, channel, target,
                  message, status, error, sent_at, created_at]
        filter:
          organization:
            members:
              user_id: { _eq: X-Hasura-User-Id }
  event_triggers:
    # the notify step type is delivered by this Event Trigger, not inline
    - name: notification_queued
      definition:
        enable_manual: true
        insert:
          columns: '*'
      retry_conf:
        num_retries: 3
        interval_sec: 10
        timeout_sec: 60
      webhook_from_env: NHOST_FUNCTIONS_URL_NOTIFY
      headers:
        - name: x-internal-secret
          value_from_env: INTERNAL_WEBHOOK_SECRET

# -------------------------------------------------------------- watched_records
- table:
    schema: public
    name: watched_records
  object_relationships:
    - name: organization
      using:
        foreign_key_constraint_on: org_id
  select_permissions:
    - role: user
      permission:
        columns: [id, org_id, source, payload, created_by, created_at]
        filter:
          organization:
            members:
              user_id: { _eq: X-Hasura-User-Id }
  insert_permissions:
    - role: user
      permission:
        columns: [org_id, source, payload]
        set:
          created_by: X-Hasura-User-Id
        check:
          organization:
            members:
              _and:
                - user_id: { _eq: X-Hasura-User-Id }
                - role: { _in: [owner, editor] }
  event_triggers:
    # database event trigger: a row landing here starts matching workflows
    - name: watched_record_inserted
      definition:
        enable_manual: true
        insert:
          columns: '*'
      retry_conf:
        num_retries: 2
        interval_sec: 10
        timeout_sec: 60
      webhook_from_env: NHOST_FUNCTIONS_URL_WATCHED_ROW
      headers:
        - name: x-internal-secret
          value_from_env: INTERNAL_WEBHOOK_SECRET

# ----------------------------------------------------------- quota_reservations
- table:
    schema: public
    name: quota_reservations
  object_relationships:
    - name: organization
      using:
        foreign_key_constraint_on: org_id
  select_permissions:
    - role: user
      permission:
        columns: [id, org_id, amount, granted, reason, created_at]
        filter:
          organization:
            members:
              user_id: { _eq: X-Hasura-User-Id }

# ------------------------------------------------- org_usage_current_month (view)
- table:
    schema: public
    name: org_usage_current_month
  array_relationships:
    - name: members
      using:
        manual_configuration:
          remote_table: { schema: public, name: org_members }
          column_mapping: { org_id: org_id }
  select_permissions:
    - role: user
      permission:
        columns: [org_id, org_name, quota_limit, quota_used, quota_remaining,
                  runs_this_month, succeeded_this_month, failed_this_month,
                  paused_now, avg_run_seconds]
        filter:
          members:
            user_id: { _eq: X-Hasura-User-Id }
