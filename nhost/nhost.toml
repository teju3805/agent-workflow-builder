# Nhost config-as-code. This file configures BOTH the local environment and the
# cloud project — whatever is pushed to git overwrites the cloud settings, so
# anything environment-specific goes through `secrets.*` rather than being
# hardcoded here.
#
# Local values live in ./.secrets (gitignored).
# Cloud values are set in the dashboard: Settings -> Secrets.
#
# NOTE: nhost reserves the NHOST_ and HASURA_ prefixes for the variables it
# injects itself, so user-defined variables below use the WF_ prefix. Secret
# *names* are not restricted, which is why WF_GRAPHQL_URL can read the
# existing NHOST_GRAPHQL_URL secret.

[global]

# ---- shared between Hasura and the functions -------------------------------
[[global.environment]]
name = 'INTERNAL_WEBHOOK_SECRET'
value = '{{ secrets.INTERNAL_WEBHOOK_SECRET }}'

# ---- how the functions reach Hasura ----------------------------------------
[[global.environment]]
name = 'WF_GRAPHQL_URL'
value = '{{ secrets.NHOST_GRAPHQL_URL }}'

[[global.environment]]
name = 'WF_ADMIN_SECRET'
value = '{{ secrets.HASURA_GRAPHQL_ADMIN_SECRET }}'

# ---- where Hasura sends Event Triggers -------------------------------------
# Full URLs, one secret each: a wrong value here does not fail validation, it
# just makes runs hang at `pending`, so they are kept explicit.
[[global.environment]]
name = 'WF_EVENT_RUN_EXECUTOR_URL'
value = '{{ secrets.WF_EVENT_RUN_EXECUTOR_URL }}'

[[global.environment]]
name = 'WF_EVENT_NOTIFY_URL'
value = '{{ secrets.WF_EVENT_NOTIFY_URL }}'

[[global.environment]]
name = 'WF_EVENT_WATCHED_ROW_URL'
value = '{{ secrets.WF_EVENT_WATCHED_ROW_URL }}'

# ---- LLM -------------------------------------------------------------------
[[global.environment]]
name = 'LLM_API_KEY'
value = '{{ secrets.LLM_API_KEY }}'

[[global.environment]]
name = 'LLM_API_URL'
value = 'https://api.groq.com/openai/v1/chat/completions'

[[global.environment]]
name = 'LLM_MODEL'
value = 'llama-3.1-8b-instant'

[[global.environment]]
name = 'SLACK_WEBHOOK_URL'
value = '{{ secrets.SLACK_WEBHOOK_URL }}'

# ---- Hasura ----------------------------------------------------------------
[hasura]
adminSecret = '{{ secrets.HASURA_GRAPHQL_ADMIN_SECRET }}'
webhookSecret = '{{ secrets.NHOST_WEBHOOK_SECRET }}'

[[hasura.jwtSecrets]]
type = 'HS256'
key = '{{ secrets.HASURA_GRAPHQL_JWT_SECRET }}'

[hasura.settings]
enableConsole = true
devMode = false
# quota functions must never be callable by a client role, so nothing is
# inferred from the returning table's select permission
inferFunctionPermissions = false

# ---- Auth ------------------------------------------------------------------
[auth]

[auth.redirections]
# CLIENT_URL is http://localhost:3000 locally and the Vercel URL in the cloud
clientUrl = '{{ secrets.CLIENT_URL }}'
allowedUrls = ['{{ secrets.CLIENT_URL }}', 'http://localhost:3000']

[auth.method.emailPassword]
emailVerificationRequired = false

# ---- Functions -------------------------------------------------------------
[functions]
[functions.node]
version = 20
